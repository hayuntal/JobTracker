name: Job check

on:
  schedule:
    # Hourly, on the hour (UTC). GitHub queues scheduled jobs under load, so
    # actual firing can drift a few minutes — harmless for this use case.
    - cron: "0 * * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

# Only one run at a time: two concurrent runs would both read the same state
# file and could send you the same job twice.
concurrency:
  group: job-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # needed to commit the updated state file

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Without this the run would "succeed" while printing the digest to the
      # Actions log and delivering nothing — indistinguishable from a quiet day.
      - name: Verify delivery is configured
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Missing repository secrets TELEGRAM_BOT_TOKEN and/or TELEGRAM_CHAT_ID."
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Check for new jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_MAX_JOBS: ${{ vars.DIGEST_MAX_JOBS || 12 }}
        run: python -m jobtracker run

      - name: Commit updated state
        # Runs even if the check step failed, so a partial run still records
        # whatever it managed to deliver. Losing this step means the jobs it
        # already delivered get delivered again next hour.
        if: always()
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep this run's state outside the work tree — the loop below resets
          # the tree to the remote before re-applying it.
          cp state/seen_jobs.json "${RUNNER_TEMP}/ours.json"

          for attempt in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"

            # Union, never rebase. seen_jobs.json is a map of fingerprints, so
            # merging is order-independent and cannot conflict. `git pull
            # --rebase` treats it as opaque text, hits a content conflict, and
            # strands the job with unmerged files that every retry then trips
            # over — which is exactly how this step used to fail.
            python -m jobtracker merge-state "${RUNNER_TEMP}/ours.json"

            git add state/
            if git diff --cached --quiet; then
              echo "No state change."
              exit 0
            fi
            git commit -q -m "chore: update seen-jobs state [skip ci]"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "State pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Lost the push race on attempt ${attempt}; re-merging."
            sleep $((attempt * 3))
          done
          echo "::error::Could not push state after 5 attempts. Jobs already \
          delivered are not recorded and will be sent again next run."
          exit 1
