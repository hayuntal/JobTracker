    - ישראל
    - tel aviv
    - tel-aviv
    - tel aviv-yafo
    - tlv
    - gush dan
    - herzliya
    - herzeliya
    - ra'anana
    - raanana
    - netanya
    - haifa
    - jerusalem
    - petah tikva
    - petach tikva
    - yokneam
    - yoqneam
    - beer sheva
    - be'er sheva
    - rehovot
    - nes ziona
    - ness ziona
    - caesarea
    - ramat gan
    - ramat hasharon
    - givatayim
    - kfar saba
    - hod hasharon
    - airport city
    - modi'in
    - modiin
    - rosh ha'ayin
    - rosh haayin
    - ashdod
    - ashkelon
    - lod
    - yehud
    - or yehuda
    - bnei brak
    - holon
    - bat yam
    - rishon lezion
    - kiryat gat
    - kiryat ono
    - migdal haemek
    - karmiel
    - tirat carmel
    # Hebrew city names, for the Hebrew-language sources.
    - תל אביב
    - הרצליה
    - רעננה
    - פתח תקווה
    - חיפה
    - ירושלים
    - נתניה
    - באר שבע
    - רמת גן

  # You opted IN to remote roles open to Israel. A posting with no Israeli city
  # still qualifies if it looks remote AND is scoped to a region covering
  # Israel (or has no region restriction at all).
  include_remote: true
  remote_terms:
    - remote
    - hybrid
    - work from home
    - anywhere
    - עבודה מהבית
    - היברידי
  # If a remote posting names one of these regions, treat it as Israel-eligible.
  remote_ok_regions:
    - israel
    - emea
    - europe
    - global
    - worldwide
    - international
  # ...but reject remote postings explicitly scoped to somewhere else.
  # These are matched as whole words, and only ever consulted for a remote
  # posting that named no Israeli city — so a bare "us" here cannot misfire on
  # "Jerusalem" or on a job already located in Israel.
  remote_reject_regions:
    - united states
    - usa
    - us
    - u.s.
    - us only
    - north america
    - americas
    - canada
    - latam
    - apac
    - india
    - uk only
    - united kingdom only
    - germany only
    - poland only
