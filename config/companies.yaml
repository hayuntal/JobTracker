  # ---- Comeet ------------------------------------------------------------
  # Comeet is very common in Israel (monday.com, Rapyd, eToro, Verbit,
  # Coralogix, Playtika...). It needs a company UID + token pair that is only
  # present in the JS-rendered careers page, so it can't be guessed like the
  # others. Run `/add-company <name>` — it drives a browser to extract the
  # pair — then entries appear here as:
  #
  # - name: Example Co
  #   provider: comeet
  #   uid: "12.ABC"
  #   token: "34.DEF"
