  # ---- Comeet ------------------------------------------------------------
  # Comeet is the most common ATS on Israeli careers pages. It is not
  # slug-addressable: each entry needs the company's own `uid` + `token` pair,
  # which is embedded in the rendered careers page (as `COMEET.init({...})` or
  # as `"comeet_token"`/`"comeet_uid"` in the WordPress embed). Requesting
  # without the token returns {"status":400,"message":"Token is missing"}.
  #
  # These rotate. A 400 here means the pair was re-issued — re-extract it from
  # the careers page rather than guessing.
  - name: Aqua Security
    provider: comeet
    uid: "91.001"
    token: "191644966966644E194B3191644644"
    verified_il_jobs: 5

