# ---------------------------------------------------------------------------
# Israeli tech companies and the ATS that powers their careers page.
#
# Every entry below was verified live: the endpoint responded 200 AND returned
# at least one job with an Israeli location. `verified_il_jobs` is the count at
# the time of setup — it's a snapshot for reference, not used by the code.
#
# A token that resolves is NOT proof it is the right company: slugs like
# `lever/via` or `greenhouse/next` hit real but unrelated boards. Nothing lands
# here until its feed returns a posting in an actual Israeli city.
#
# To add a company, run:   /add-company <name>
# ---------------------------------------------------------------------------

